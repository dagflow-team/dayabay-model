[build-system]
build-backend = "setuptools.build_meta"

requires = [ "packaging", "setuptools", "setuptools-scm", "wheel" ]

[project]
name = "dayabay-model"
description = "The model of the Daya Bay Reactor Neutrino Experiment for neutrino oscillation analysis based on open gadolinium capture data"
readme = "README.md"
license = "MIT"
maintainers = [ { name = "DAGModelling Team", email = "dagflow@jinr.ru" } ]
authors = [ { name = "DAGModelling Team", email = "dagflow@jinr.ru" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "colorama",
  "dgm-fit>=0.4.0",
  "dgm-reactor-neutrino>=0.3.0",
  "dayabay-data-official",
  "more-itertools",
  "semver",
]

optional-dependencies.test = [
  "dgm-reactor-neutrino[test]>=0.3.0",
  "ipykernel",
  "ipython",
  "ipywidgets",
  "nbconvert",
  "parameterized",
  "pygraphviz",
]

urls."Bug Tracker" = "https://github.com/dayabay-experiment/dayabay-model/issues"
urls.documentation = "https://github.com/dayabay-experiment/dayabay-model/wiki"
urls.homepage = "https://github.com/dayabay-experiment/dayabay-model"
urls.repository = "https://github.com/dayabay-experiment/dayabay-model"

[tool.setuptools.package-data]
"*" = [ "*.yaml" ]

[tool.setuptools.packages.find]
where = [ "src" ]
exclude = [
  "tests*",
]

[tool.setuptools_scm]
write_to = "src/dayabay_model/__version__.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 5

[tool.docformatter]
wrap-summaries = 100
wrap-descriptions = 100
